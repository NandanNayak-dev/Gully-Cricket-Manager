[build]
  # Install and build the React frontend
  command = "npm ci --prefix frontend --include=dev && npm run build --prefix frontend"
  # Serve the frontend dist folder
  publish = "frontend/dist"
  # Tell Netlify where our serverless backend functions are located
  functions = "backend/netlify/functions"

# Rewrite API requests to the Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

# Fallback for React Router (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
